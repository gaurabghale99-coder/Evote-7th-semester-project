<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Vote - Select Language | भाषा छान्नुहोस्</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="language-card">
            <div class="logo">
                <h1>🗳️ E-Vote</h1>
            </div>
            
            <h2>Select Your Language | आफ्नो भाषा छान्नुहोस्</h2>
            
            <div class="language-options">
                <div class="language-option" data-lang="en">
                    <div class="lang-icon">🇬🇧</div>
                    <h3>English</h3>
                    <p>Continue in English</p>
                </div>
                
                <div class="language-option" data-lang="np">
                    <div class="lang-icon">🇳🇵</div>
                    <h3>नेपाली</h3>
                    <p>नेपालीमा जारी राख्नुहोस्</p>
                </div>
            </div>
            
            <div class="back-button">
                <button class="btn btn-secondary" onclick="window.location.replace('index.html')">
                    ← Back | फिर्ता
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
